# PHP mitigations for CVE-2026-109618 (OOM corruption) and
# CVE-2026-109619 (stale global state). Partial — not a substitute
# for upgrading to PHP 8.3.36+. Remove this file once the running
# container reports php -v >= 8.3.36 across one full compose up cycle.
#
# Source: https://www.php.net/archive/2026.php#2026-10-21-5
#
# Loaded via docker-compose.yml bind-mount into
# /usr/local/etc/php/conf.d/, which Debian-based `wordpress:php8.3-apache`
# scans at startup (overrides php.ini defaults).

; ── CVE-2026-109618: OOM corruption ─────────────────────────────────────────
; Remove the controllable PHP memory_limit failure path. Container-level
; mem_limit (set in docker-compose.yml) remains the availability bulkhead.
memory_limit = -1

; Cap decoded request body. Headless WP serves REST+GraphQL to Next.js;
; no front-door uploads. If media uploads via /wp-admin become necessary,
; raise to 32M and keep upload_max_filesize strictly below.
post_max_size = 8M
upload_max_filesize = 2M

; ── CVE-2026-109619: stale global state ─────────────────────────────────────
; Disable the confirmed session upload-progress attack path. Must apply
; before request parsing — a per-request ini_set() or .user.ini is too late.
session.upload_progress.enabled = 0
